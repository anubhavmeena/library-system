name: Build and Deploy

# Builds every service's Docker image off the production box (on GitHub's
# runners), pushes them to GHCR, then tells the production server to pull
# the new images and restart — the server never runs `docker compose build`.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api-gateway
            context: ./backend
            dockerfile: ./backend/api-gateway/Dockerfile
          - name: auth-service
            context: ./backend
            dockerfile: ./backend/auth-service/Dockerfile
          - name: user-service
            context: ./backend
            dockerfile: ./backend/user-service/Dockerfile
          - name: membership-service
            context: ./backend
            dockerfile: ./backend/membership-service/Dockerfile
          - name: seat-service
            context: ./backend
            dockerfile: ./backend/seat-service/Dockerfile
          - name: notification-service
            context: ./backend
            dockerfile: ./backend/notification-service/Dockerfile
          - name: admin-service
            context: ./backend
            dockerfile: ./backend/admin-service/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # VITE_CASHFREE_ENV is a public, non-secret build-time flag (only
          # ever "sandbox" or "production") — safe to keep as a repo variable.
          # Unused by every non-frontend Dockerfile, so passing it always is harmless.
          build-args: |
            VITE_CASHFREE_ENV=${{ vars.CASHFREE_ENV || 'sandbox' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/library-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/library-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.PROD_APP_DIR }}"
            git pull --ff-only
            docker compose -f docker-compose.services.yml pull
            docker compose -f docker-compose.services.yml up -d
            docker image prune -f
