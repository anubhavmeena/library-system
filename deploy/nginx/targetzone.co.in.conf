# Production Nginx vhost for the rust-backend + static-frontend deployment on
# the EC2 box (mail.targetzone.co.in / targetzone.co.in). Lives on the server
# at /etc/nginx/sites-enabled/targetzone.co.in — this repo copy is a reference
# snapshot only, not deployed automatically; after editing the live file,
# copy the change back here too so the two don't drift.
#
# Distinct from frontend/nginx.conf, which is the Docker/Java-stack config
# (serves /usr/share/nginx/html, proxies to api-gateway/user-service
# container hostnames) — unrelated to this EC2 deployment.
#
# To apply a change on the server: edit the file, then
#   sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT: `location /uploads/` must keep its `^~` modifier. Without it,
# the regex location below for cached static assets (`\.(js|css|png|jpg|...)$`)
# wins over the plain-prefix `/uploads/` match for any image/font file under
# /uploads/ — regex locations always take precedence over a non-^~ prefix
# match in Nginx regardless of declaration order. This exact regression once
# broke every photo/receipt/ID-card URL (they all 404'd) after the static
# asset-caching block was added; ^~ forces /uploads/ to win outright and skip
# regex evaluation entirely.

server {
    listen 80;
    server_name targetzone.co.in www.targetzone.co.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name targetzone.co.in www.targetzone.co.in;

    ssl_certificate     /etc/letsencrypt/live/targetzone.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/targetzone.co.in/privkey.pem;

    root /var/www/library-frontend;
    index index.html;

    # Frontend
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Uploaded files (photos, receipts, ID cards, gallery) served by the Rust backend
    location ^~ /uploads/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Gateway
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
